<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Terminal // Mercado & Scouting Pro</title>
    <style>
        body {
            background-color: #05070b;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
        }
        h1, h2 {
            color: #fff;
            border-bottom: 1px dashed #1f293d;
            padding-bottom: 6px;
        }
        .section {
            background: #0d1322;
            border: 1px solid #1f293d;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
        }
        input, select {
            background: #05070b;
            color: #00ff66;
            border: 1px solid #38bdf8;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .card {
            background: #111827;
            border: 1px solid #1f293d;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .price { color: #facc15; font-weight: bold; }
        .trend-up { color: #22c55e; font-weight: bold; }
        .trend-down { color: #ef4444; font-weight: bold; }
        .badge {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: #1e293b;
            color: #38bdf8;
        }
        .vs-box {
            background: #05070b;
            border: 1px dashed #facc15;
            padding: 10px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>⚡ FANTASY TERMINAL // SCOUTING & MARKET</h1>

    <!-- BUSCADOR Y FILTRO DE MERCADO -->
    <div class="section">
        <h2>🔍 Buscador de Mercado (Subidas / Bajadas)</h2>
        <input type="text" id="searchInput" placeholder="Escribe el nombre o equipo (ej: Real Madrid, Barcelona, Ayoze)..." onkeyup="filterMarket()">
        
        <div id="market-list" style="max-height: 350px; overflow-y: auto; margin-top: 10px;">
            <!-- Datos cargados dinámicamente -->
        </div>
    </div>

    <!-- COMPARADOR 1 VS 1 -->
    <div class="section">
        <h2>⚖️ Comparador 1 vs 1 & Titularidad</h2>
        <div class="grid-2">
            <div>
                <label>Jugador A:</label>
                <select id="player1" onchange="comparePlayers()">
                    <option value="">Selecciona...</option>
                </select>
            </div>
            <div>
                <label>Jugador B:</label>
                <select id="player2" onchange="comparePlayers()">
                    <option value="">Selecciona...</option>
                </select>
            </div>
        </div>
        <div id="comparison-result" class="vs-box">
            Selecciona dos jugadores para contrastar valor, tendencia y % de titularidad.
        </div>
    </div>

    <script>
        // Base de datos completa ampliada de LaLiga
        const dbPlayers = [
            { name: "Kylian Mbappé", team: "Real Madrid", price: 175809468, trend: "+1.274.835 €", status: "Titular 95%", isUp: true, points: 120 },
            { name: "Lamine Yamal", team: "Barcelona", price: 191735777, trend: "-942.285 €", status: "Titular 95%", isUp: false, points: 127 },
            { name: "Raphinha", team: "Barcelona", price: 173348564, trend: "+796.054 €", status: "Titular 90%", isUp: true, points: 128 },
            { name: "Ayoze Pérez", team: "Villarreal", price: 68420100, trend: "+854.200 €", status: "Titular 90%", isUp: true, points: 112 },
            { name: "Robert Lewandowski", team: "Barcelona", price: 154200300, trend: "+420.100 €", status: "Titular 95%", isUp: true, points: 135 },
            { name: "Vinicius Junior", team: "Real Madrid", price: 162441583, trend: "-1.246.713 €", status: "Titular 90%", isUp: false, points: 118 },
            { name: "Jude Bellingham", team: "Real Madrid", price: 168171216, trend: "+1.193.128 €", status: "Titular 95%", isUp: true, points: 125 },
            { name: "Arda Güler", team: "Real Madrid", price: 41223132, trend: "+2.137.574 €", status: "Titular 70%", isUp: true, points: 91 },
            { name: "Pedri", team: "Barcelona", price: 110500000, trend: "+650.000 €", status: "Titular 90%", isUp: true, points: 105 },
            { name: "Dani Olmo", team: "Barcelona", price: 93835837, trend: "-1.181.595 €", status: "Duda 50%", isUp: false, points: 80 },
            { name: "Federico Valverde", team: "Real Madrid", price: 120400000, trend: "+310.000 €", status: "Titular 95%", isUp: true, points: 110 },
            { name: "Antoine Griezmann", team: "Atlético de Madrid", price: 135600000, trend: "+450.000 €", status: "Titular 95%", isUp: true, points: 115 },
            { name: "Julian Álvarez", team: "Atlético de Madrid", price: 142000000, trend: "+980.000 €", status: "Titular 90%", isUp: true, points: 108 },
            { name: "Alexander Sørloth", team: "Atlético de Madrid", price: 78900000, trend: "-340.000 €", status: "Titular 75%", isUp: false, points: 85 },
            { name: "Takefusa Kubo", team: "Real Sociedad", price: 65400000, trend: "+520.000 €", status: "Titular 90%", isUp: true, points: 94 },
            { name: "Mikel Oyarzabal", team: "Real Sociedad", price: 71200000, trend: "-150.000 €", status: "Titular 85%", isUp: false, points: 88 },
            { name: "Isco Alarcón", team: "Real Betis", price: 56641950, trend: "+1.353.218 €", status: "Titular 80%", isUp: true, points: 92 },
            { name: "Nico Williams", team: "Athletic Club", price: 115000000, trend: "+620.000 €", status: "Titular 95%", isUp: true, points: 102 },
            { name: "Inaki Williams", team: "Athletic Club", price: 85400000, trend: "+230.000 €", status: "Titular 90%", isUp: true, points: 96 },
            { name: "Oihan Sancet", team: "Athletic Club", price: 62100000, trend: "-410.000 €", status: "Titular 80%", isUp: false, points: 79 },
            { name: "Girona Star (Tsygankov)", team: "Girona", price: 52000000, trend: "+310.000 €", status: "Titular 85%", isUp: true, points: 81 },
            { name: "Kirian Rodríguez", team: "UD Las Palmas", price: 42100000, trend: "+190.000 €", status: "Titular 90%", isUp: true, points: 78 },
            { name: "Alberto Moleiro", team: "UD Las Palmas", price: 49500000, trend: "+740.000 €", status: "Titular 90%", isUp: true, points: 86 }
        ];

        function initApp() {
            renderMarket(dbPlayers);
            populateSelects();
        }

        function renderMarket(data) {
            const container = document.getElementById('market-list');
            container.innerHTML = '';
            if(data.length === 0) {
                container.innerHTML = '<div style="color: #ef4444; text-align:center;">No se encontró ningún jugador.</div>';
                return;
            }
            data.forEach(p => {
                const trendClass = p.isUp ? 'trend-up' : 'trend-down';
                container.innerHTML += `
                    <div class="card">
                        <div class="row">
                            <span><strong>${p.name}</strong> <span style="color:#94a3b8">(${p.team})</span></span>
                            <span class="price">${p.price.toLocaleString()} €</span>
                        </div>
                        <div class="row" style="margin-top: 5px;">
                            <span class="badge">🎯 ${p.status}</span>
                            <span class="${trendClass}">${p.trend}</span>
                        </div>
                    </div>
                `;
            });
        }

        function filterMarket() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = dbPlayers.filter(p => p.name.toLowerCase().includes(query) || p.team.toLowerCase().includes(query));
            renderMarket(filtered);
        }

        function populateSelects() {
            const p1 = document.getElementById('player1');
            const p2 = document.getElementById('player2');
            dbPlayers.forEach((p, index) => {
                p1.innerHTML += `<option value="${index}">${p.name} (${p.team})</option>`;
                p2.innerHTML += `<option value="${index}">${p.name} (${p.team})</option>`;
            });
        }

        function comparePlayers() {
            const idx1 = document.getElementById('player1').value;
            const idx2 = document.getElementById('player2').value;
            const resBox = document.getElementById('comparison-result');

            if(idx1 === "" || idx2 === "") {
                resBox.innerHTML = "Selecciona ambos jugadores para ver la comparativa.";
                return;
            }

            const pA = dbPlayers[idx1];
            const pB = dbPlayers[idx2];

            resBox.innerHTML = `
                <div style="display: flex; justify-content: space-between; text-align: left; font-size: 0.9rem;">
                    <div style="width: 48%;">
                        <strong style="color: #38bdf8;">${pA.name}</strong><br>
                        💰 ${pA.price.toLocaleString()} €<br>
                        📈 Tendencia: <span class="${pA.isUp ? 'trend-up':'trend-down'}">${pA.trend}</span><br>
                        🎯 Titularidad: <strong>${pA.status}</strong><br>
                        ⭐ Puntos: ${pA.points}
                    </div>
                    <div style="width: 48%; border-left: 1px dashed #38bdf8; padding-left: 8px;">
                        <strong style="color: #38bdf8;">${pB.name}</strong><br>
                        💰 ${pB.price.toLocaleString()} €<br>
                        📈 Tendencia: <span class="${pB.isUp ? 'trend-up':'trend-down'}">${pB.trend}</span><br>
                        🎯 Titularidad: <strong>${pB.status}</strong><br>
                        ⭐ Puntos: ${pB.points}
                    </div>
                </div>
            `;
        }

        initApp();
    </script>
</body>
</html>
