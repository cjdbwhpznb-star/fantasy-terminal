<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Terminal - LaLiga</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #fff;
            font-size: 1.5rem;
            border-bottom: 1px solid #1f293d;
            padding-bottom: 10px;
        }
        .card {
            background: #131b2e;
            border: 1px solid #1f293d;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
        }
        .player-name {
            font-weight: bold;
            color: #38bdf8;
            font-size: 1.1rem;
        }
        .trend {
            color: #22c55e;
        }
    </style>
</head>
<body>
    <h1>⚡ FANTASY TERMINAL // MARKET PUMPS</h1>
    <div id="pumps-container">Cargando datos del servidor...</div>

    <script>
        fetch('https://fantasy-terminal.onrender.com/api/pumps')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('pumps-container');
                container.innerHTML = '';
                data.forEach(p => {
                    container.innerHTML += `
                        <div class="card">
                            <div class="player-name">${p.name} (${p.team})</div>
                            <div>Precio: ${p.price}</div>
                            <div class="trend">Tendencia: ${p.trend}</div>
                            <div>Estado: <strong>${p.status}</strong></div>
                        </div>
                    `;
                });
            })
            .catch(err => {
                document.getElementById('pumps-container').innerHTML = 'Error al conectar con el servidor.';
            });
    </script>
</body>
</html>
